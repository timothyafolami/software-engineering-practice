[project]
name = "craft-lab-api"
version = "1.0.0"
description = "Layer 8 shared lab: FastAPI + SQLAlchemy 2.0 async + Postgres 18"
requires-python = ">=3.13"

# Pins from lab/README.md. They are pinned so mutation scores and property runs
# compare across sessions, not because newer versions are broken.
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "sqlalchemy>=2.0.39",
  "asyncpg>=0.30",
  "pydantic>=2.10",
  "httpx>=0.28",
]

[project.optional-dependencies]
test = [
  "pytest==9.1.*",
  "pytest-asyncio>=0.25",
  "pytest-repeat>=0.9",          # the --count=20 intermittency run in topic 4
  "hypothesis==6.165.*",
  "coverage==7.15.*",
  "mutmut==3.7.*",
  "testcontainers==4.15.*",
  "aiosqlite>=0.20",             # tests/unit and tests/properties, no container
  "schemathesis==4.24.*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "container: needs Docker (testcontainers Postgres 18)",
  "slow: mutation or high-example-count runs",
  "no_assertions: topic 8 row 1 -- calls the function and checks nothing",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
branch = true          # statement coverage cannot distinguish `if x:` taken
                       # from not-taken, which is half of topic 8's point
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.mutmut]
paths_to_mutate = "app/core/pagination.py,app/core/money.py"
tests_dir = "tests/"
