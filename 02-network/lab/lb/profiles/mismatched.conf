# Topic 4, the deployment you get by changing nothing.
#
#   LB idle timeout      60 s   (this file)
#   backend idle timeout  5 s   (uvicorn --timeout-keep-alive, api/entrypoint.sh)
#
# The backend closes first, while nginx is still holding that connection in a
# pool it is about to reuse. That is the bug: FIN, then a request written onto
# the same four-tuple, then RST, then 502.

upstream api_backend {
    server api:8000;
    keepalive         32;      # idle connections nginx keeps to the backend
    keepalive_timeout 60s;     # ...for this long. Longer than the backend's 5 s.
}

log_format lab '$time_iso8601 $status $request_time $upstream_addr '
               '$upstream_status "$request"';

server {
    listen 8080;
    access_log /var/log/nginx/access.log lab;

    location / {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";   # required, or nginx sends Connection: close
        # Off on purpose: nginx retrying to another upstream would hide the
        # very race this topic is trying to observe.
        proxy_next_upstream off;
    }
}
