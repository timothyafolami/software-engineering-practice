# Topic 4, correct ordering AND bounded connection reuse.
#
#   LB idle timeout      60 s   (this file)
#   backend idle timeout 75 s   (uvicorn --timeout-keep-alive, api/entrypoint.sh)
#
# The rule, in one line: the backend's idle timeout must be strictly longer
# than the proxy's. Now nginx is always the side that closes, and nginx is the
# side that knows it is closing, because it owns the pool.

upstream api_backend {
    server api:8000;
    keepalive         32;      # idle connections nginx keeps to the backend
    keepalive_timeout 60s;     # ...for this long. Shorter than the backend's 75 s.
    # A pool of immortal connections never discovers a new backend, so DNS
    # changes, scale-ups and rolling deploys never take effect for this client
    # (Topic 5 is the whole story). Bounding reuse costs a handshake every N
    # requests on purpose. nginx's own default is 1000; 50 is small enough that
    # you can watch rotation happen inside one short run.
    keepalive_requests 50;
    keepalive_time     1h;
}

log_format lab '$time_iso8601 $status $request_time $upstream_addr '
               '$upstream_status "$request"';

server {
    listen 8080;
    access_log /var/log/nginx/access.log lab;

    location / {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";   # required, or nginx sends Connection: close
        # Off on purpose: nginx retrying to another upstream would hide the
        # very race this topic is trying to observe.
        proxy_next_upstream off;
    }
}
