# Primary config for the Layer 3 lab. Deliberately small and commented, because
# every setting here changes a number some topic in this layer reports.

listen_addresses = '*'
port = 5432
max_connections = 100          # the default, on purpose: Topic 7's arithmetic
                               # is about hitting THIS number, so raising it
                               # would remove the experiment.

shared_buffers = 512MB
effective_cache_size = 1GB
work_mem = 8MB                 # small enough that Topic 4's hash joins can
                               # spill to disk and show Batches > 1
maintenance_work_mem = 128MB

# SSD costs. The 4.0 default assumes a seek penalty this hardware does not have
# and distorts every plan in Topics 3 and 4. lab/local sets these per SESSION
# instead, because it must not edit a postgresql.conf you share with other work;
# here the whole cluster is disposable, so it is set once.
random_page_cost = 1.1
effective_io_concurrency = 200

# Postgres 18 default. io_uring is not usable inside Docker Desktop's Linux VM,
# so leave this alone on macOS -- a number produced chasing io_uring here is a
# number about the VM, not about Postgres.
io_method = worker

# Replication, for Topic 8. wal_level = logical rather than replica so Topic 2's
# logical-slot experiment also works on this cluster; a physical standby is
# happy with either.
wal_level = logical
max_wal_senders = 10
max_replication_slots = 10
wal_keep_size = '512MB'
hot_standby = on

# Observability the topics actually read.
shared_preload_libraries = 'pg_stat_statements,auto_explain'
pg_stat_statements.max = 10000
pg_stat_statements.track = all
auto_explain.log_min_duration = '200ms'
auto_explain.log_analyze = on
auto_explain.log_buffers = on
auto_explain.log_nested_statements = on      # Topic 6: N+1 statements are nested
track_io_timing = on
log_lock_waits = on            # Topic 5: waits appear in the log with the
                               # blocking PID, after deadlock_timeout elapses
log_min_duration_statement = 500
log_line_prefix = '%m [%p] %q%u@%d '

# Guardrails that are per-session settings in production, set here so the lab
# cannot wedge itself while nobody is looking.
idle_in_transaction_session_timeout = '5min'
