# Appended to the standby's postgresql.auto.conf after pg_basebackup -R.
#
# recovery_min_apply_delay is added by compose.yml from $APPLY_DELAY, so the
# lag is a number you chose rather than one you waited for. Set APPLY_DELAY=0
# to measure natural lag instead -- run it both ways, the comparison is the
# lesson.

hot_standby = on
hot_standby_feedback = off      # ON makes the standby hold back the PRIMARY's
                                # vacuum horizon, which is Topic 2's xmin
                                # starvation arriving from a second machine.
                                # Turn it on deliberately when you want to see
                                # that, not by default.
max_standby_streaming_delay = '30s'
